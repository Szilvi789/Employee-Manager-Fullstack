# Enable debug with breakpoints in IntelliJ or other IDE
debug=false
# MySQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/employeemanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Log JPA queries - Comment this in production
spring.jpa.show-sql=true
# Only for testing purposes - Comment this in production
spring.jpa.hibernate.ddl-auto=update
# Use MySQL InnoDB Engine (supports Foreign Keys) for SQL Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
